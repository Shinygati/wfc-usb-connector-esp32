name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Original project, for the RT2570 driver comparison test (rt2570_test.go).
      - uses: actions/checkout@v4
        with:
          repository: edgarburgues/wfc-usb-connector
          path: upstream

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages for the original driver
        run: python -m pip install pyusb==1.3.1 libusb-package==1.0.30.0

      - name: Test
        env:
          WFC_ORIGINAL_PROTO: ${{ github.workspace }}/upstream/proto
        run: go test -count=1 -v ./...

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/WFC-Connector.exe .

      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o ../dist/wfc-connector-linux-x64 .

      - uses: actions/upload-artifact@v4
        with:
          name: WFC-Connector
          path: dist/
