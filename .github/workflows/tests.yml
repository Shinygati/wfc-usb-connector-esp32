name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check standalone CLI without desktop dependencies
        run: python proto/ap.py --help
      - name: Install optional desktop dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Download verified libslirp runtime
        run: python tools/fetch_slirp.py
      - name: Check Python syntax
        run: python -m compileall -q gui.py desktop proto tests tools re
      - name: Run protocol and network tests without USB hardware
        run: python -m unittest discover -s tests -v
